<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F8F9FB" />
    <meta
      name="description"
      content="Costs — gerencie projetos, serviços e orçamentos em um só lugar."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo-cost.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Costs — Gestão de projetos e orçamentos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('costs-theme');
          var mode = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'light';
          var resolved = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode;
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Você precisa habilitar o JavaScript para usar o Costs.</noscript>
    <div id="root"></div>
  </body>
</html>
